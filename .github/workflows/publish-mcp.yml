# Derived from OpenTakeoff by Kentucky AI and the OpenTakeoff contributors.
# Apache-2.0 license and upstream attribution are preserved in LICENSE and NOTICE.
#
# IMPORTANT: this fork intentionally does NOT publish the upstream-owned
# `opentakeoff-mcp` npm package or `io.github.Kentucky-ai/opentakeoff` MCP
# Registry identity. Tagged fork builds are validated and archived only.
name: Validate MSM MCP Compatibility Package

on:
  push:
    tags: ["msm-mcp-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    if: github.repository == 'mainstreetmediatn-git/MSM-BidMeasure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mcp/package-lock.json

      - name: Install shared engine dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Install MCP dependencies
        working-directory: mcp
        run: npm ci --no-audit --no-fund

      - name: Verify upstream-compatible package identity
        working-directory: mcp
        run: |
          set -euo pipefail
          NAME=$(jq -r .name package.json)
          SERVER=$(jq -r .name server.json)
          if [ "$NAME" != "opentakeoff-mcp" ]; then
            echo "::error file=mcp/package.json::compatibility package must remain opentakeoff-mcp unless MSM establishes a separate registry namespace"
            exit 1
          fi
          if [ "$SERVER" != "io.github.Kentucky-ai/opentakeoff" ]; then
            echo "::error file=mcp/server.json::upstream registry identity changed unexpectedly"
            exit 1
          fi
          echo "Compatibility identity preserved; this workflow will not publish either namespace."

      - name: Typecheck
        working-directory: mcp
        run: npm run typecheck

      - name: Test
        working-directory: mcp
        run: npm test

      - name: Check generated tool count
        working-directory: mcp
        run: npm run check:tool-count

      - name: Build
        working-directory: mcp
        run: npm run build

      - name: Smoke-test packaged server
        working-directory: mcp
        run: npm run smoke:dist

      - name: Create validation tarball without publishing
        working-directory: mcp
        run: |
          mkdir -p ../artifacts
          npm pack --pack-destination ../artifacts

      - name: Upload validated compatibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: msm-bidmeasure-mcp-compatibility
          path: artifacts/*.tgz
          if-no-files-found: error
